[workspace]
resolver = "2"
members = [
    "crates/prokadiff",
    "crates/prokadiff-gd",
    "crates/prokadiff-evidence",
    "crates/prokadiff-classify",
    "crates/prokadiff-report",
]
default-members = [
    "crates/prokadiff",
    "crates/prokadiff-gd",
    "crates/prokadiff-evidence",
    "crates/prokadiff-classify",
    "crates/prokadiff-report",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Caizhaohui/ProkaDiff"
authors = ["Caizhaohui"]
description = "Prokaryotic genome diff for gene-editing QC — starter vs edited WGS"
readme = "README.md"

[workspace.dependencies]
prokadiff-gd = { path = "crates/prokadiff-gd", version = "0.1.0" }
prokadiff-evidence = { path = "crates/prokadiff-evidence", version = "0.1.0" }
prokadiff-classify = { path = "crates/prokadiff-classify", version = "0.1.0" }
prokadiff-report = { path = "crates/prokadiff-report", version = "0.1.0" }
# clap: CLI parsing for the prokdiff binary.
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
# noodles: BAM/SAM/FASTA I/O (AGENTS Rule 9; same family as SAMRust).
noodles = { version = "0.115", features = ["bam", "sam", "bgzf", "core", "fasta"] }
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
